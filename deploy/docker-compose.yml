services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aibotia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aibotia}
      POSTGRES_DB: ${POSTGRES_DB:-aibotia}
      TZ: Europe/Madrid
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aibotia} -d ${POSTGRES_DB:-aibotia}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - aibotia

  redis:
    image: redis:7.4
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - aibotia

  botd:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      APP_ENV: ${APP_ENV:-production}
      INSTANCE_ID: ${INSTANCE_ID:-default}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      HTTP_ADDR: ":3000"
      API_KEY: ${API_KEY:?API_KEY requerida}
      API_ENABLED: ${API_ENABLED:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      ADMIN_ENABLED: ${ADMIN_ENABLED:-true}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
      ADMIN_SESSION_TTL: ${ADMIN_SESSION_TTL:-12h}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6.1-sol}
      OPENAI_EMBED_MODEL: ${OPENAI_EMBED_MODEL:-text-embedding-3-small}
      DATABASE_URL: postgres://${POSTGRES_USER:-aibotia}:${POSTGRES_PASSWORD:-aibotia}@postgres:5432/${POSTGRES_DB:-aibotia}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      AUTO_MIGRATE: "true"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURE: ${SMTP_SECURE:-starttls}
      CONTACT_TO: ${CONTACT_TO:-info@nestorpons.com}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      TZ: Europe/Madrid
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - aibotia

volumes:
  pgdata:
  redisdata:

networks:
  aibotia:
    driver: bridge

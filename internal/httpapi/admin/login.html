<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aibotia · acceso</title>
<style>
  :root { color-scheme:dark; --bg:#0b141a; --panel:#202c33; --field:#2a3942; --border:#2f3b43; --text:#e9edef; --muted:#8696a0; --accent:#00a884; --on-accent:#111b21; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text); font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  form { width:min(360px,92vw); background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:24px; display:flex; flex-direction:column; gap:12px; box-shadow:0 1px 3px rgba(0,0,0,.5); }
  h1 { font-size:16px; margin:0 0 6px; color:var(--accent); }
  p { margin:0; color:var(--muted); font-size:12px; }
  label { display:flex; flex-direction:column; gap:6px; font-size:12px; color:var(--muted); }
  input { background:var(--field); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:9px 10px; font:inherit; }
  input::placeholder { color:var(--muted); }
  input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 2px rgba(0,168,132,.22); }
  button { background:var(--accent); border:1px solid var(--accent); color:var(--on-accent); font-weight:600; border-radius:6px; padding:9px 12px; cursor:pointer; font:inherit; }
  button:hover { background:#06cf9c; }
</style>
</head>
<body>
<form method="post" action="/admin/login">
  <h1>Panel de administración</h1>
  <p>Gestión de servicios y prompts del agente.</p>
  <label>Tu nombre (operador)
    <input name="name" type="text" maxlength="40" placeholder="Ej. Lledó" autocomplete="name" autofocus>
  </label>
  <label>Contraseña
    <input name="password" type="password" required autocomplete="current-password">
  </label>
  <button type="submit">Entrar</button>
</form>
</body>
</html>

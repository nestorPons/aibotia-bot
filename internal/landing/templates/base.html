{{define "base"}}<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}}</title>
  <meta name="description" content="{{.Description}}">
  <link rel="canonical" href="{{.Canonical}}">
  <meta property="og:title" content="{{.Title}}">
  <meta property="og:description" content="{{.Description}}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{.Canonical}}">
  <meta property="og:image" content="https://aibotia.com/static/img/header.webp">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#052e16">
  <link rel="icon" href="/static/img/favicon.ico" sizes="32x32">
  <link rel="preload" as="image" href="/static/img/header.webp">
  <link rel="stylesheet" href="/static/css/style.css?v=2">
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>
  {{template "header" .}}
  <main id="main">
    {{template "content" .}}
  </main>
  {{template "footer" .}}
  <script src="/static/js/vendor/htmx.min.js?v=1" defer></script>
  {{if .TurnstileSiteKey}}<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  {{end}}<script src="/static/js/main.js?v=1" defer></script>
</body>
</html>{{end}}
